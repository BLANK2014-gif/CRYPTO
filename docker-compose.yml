# =============================================================================
# Roostoo Trading Bot — Docker Compose
# =============================================================================

services:
  trading-bot:
    build: .
    container_name: roostoo-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./config:/app/config:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
